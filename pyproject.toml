[project]
name = "skimwise"
dynamic = ["version"]  # read from budget_tracker/__init__.py
description = "SkimWise: skim the fat off your spending. A private, local-only desktop budget app."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "pypdf>=5"]  # pypdf reads PDF bank statements

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "fpdf2"]  # fpdf2 writes fake PDF statements for tests
build = ["pyinstaller"]  # python scripts/build.py -> dist/SkimWise.exe

[project.gui-scripts]
skimwise = "budget_tracker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "budget_tracker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budget_tracker = ["assets/*", "assets/fonts/*"]  # ship icons and fonts with the package, not just .py files

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes/pycodestyle errors (ruff's defaults) + import sorting, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Qt's `parent=QModelIndex()` default is the standard pattern and safe (immutable value)
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
